<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 450 100" width="100%" height="100%">
  <defs>
    <linearGradient id="logoGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFDF6"/>
      <stop offset="30%" stop-color="#D4AF37"/>
      <stop offset="70%" stop-color="#AA8833"/>
      <stop offset="100%" stop-color="#F2E6C3"/>
    </linearGradient>
  </defs>
  <!-- Royal Monogram Icon -->
  <g transform="translate(10, 15)">
    <circle cx="35" cy="35" r="32" fill="none" stroke="url(#logoGold)" stroke-width="1.5"/>
    <circle cx="35" cy="35" r="26" fill="none" stroke="url(#logoGold)" stroke-width="0.8" stroke-dasharray="3,2"/>
    <text x="35" y="43" font-family="'Cinzel', serif" font-size="18" font-weight="bold" fill="url(#logoGold)" text-anchor="middle" letter-spacing="2">MD</text>
  </g>
  <!-- Brand Text -->
  <text x="95" y="46" font-family="'Cinzel', 'Playfair Display', serif" font-size="24" font-weight="bold" fill="url(#logoGold)" letter-spacing="5">MAISON D'ORIENT</text>
  <text x="98" y="68" font-family="'Montserrat', sans-serif" font-size="8.5" fill="#B39855" letter-spacing="4">HAUTE PARFUMERIE • PARIS & LAHORE</text>
</svg>