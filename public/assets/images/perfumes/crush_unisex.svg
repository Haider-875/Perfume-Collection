<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 800" width="100%" height="100%">
  <defs>
    <radialGradient id="bgGlow_crush" cx="50%" cy="50%" r="55%">
      <stop offset="0%" stop-color="#C94B74" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#080204" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="crushRuby" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E8487A"/>
      <stop offset="50%" stop-color="#9C1E45"/>
      <stop offset="100%" stop-color="#3D0616"/>
    </linearGradient>
    <filter id="shadow_crush" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="25" stdDeviation="30" flood-color="#000000" flood-opacity="0.95"/>
    </filter>
  </defs>

  <rect width="600" height="800" fill="#080204"/>
  <circle cx="300" cy="460" r="280" fill="url(#bgGlow_crush)"/>
  <ellipse cx="300" cy="720" rx="160" ry="22" fill="#000000" opacity="0.95" filter="url(#shadow_crush)"/>

  <g filter="url(#shadow_crush)">
    <!-- Gemstone Cut Cap -->
    <polygon points="270,120 330,120 350,170 300,190 250,170" fill="url(#crushRuby)" stroke="#FFB8D0" stroke-width="1.5"/>

    <!-- Multi-Faceted Gemstone Heart-Cut Body -->
    <polygon points="300,220 420,280 440,460 300,680 160,460 180,280" fill="url(#crushRuby)" stroke="#FFB8D0" stroke-width="2.5"/>

    <!-- Diamond Facet Reflection Lines -->
    <line x1="300" y1="220" x2="300" y2="680" stroke="#FFF" stroke-opacity="0.5" stroke-width="2"/>
    <line x1="180" y1="280" x2="420" y2="280" stroke="#FFF" stroke-opacity="0.4" stroke-width="1.5"/>
    <line x1="160" y1="460" x2="440" y2="460" stroke="#FFF" stroke-opacity="0.4" stroke-width="1.5"/>
    <line x1="300" y1="360" x2="160" y2="460" stroke="#FFF" stroke-opacity="0.3" stroke-width="1.5"/>
    <line x1="300" y1="360" x2="440" y2="460" stroke="#FFF" stroke-opacity="0.3" stroke-width="1.5"/>

    <!-- Center Diamond Label Plaque -->
    <polygon points="300,380 370,440 300,500 230,440" fill="#1A040A" stroke="#FFB8D0" stroke-width="2"/>

    <text x="300" y="435" font-family="'Cinzel', serif" font-size="18" font-weight="bold" fill="#FFFFFF" text-anchor="middle" letter-spacing="3">CRUSH</text>
    <text x="300" y="460" font-family="'Montserrat', sans-serif" font-size="8" fill="#FFB8D0" text-anchor="middle" letter-spacing="2">VELVET EXTRAIT</text>
  </g>
</svg>