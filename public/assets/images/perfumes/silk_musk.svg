<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 800" width="100%" height="100%">
  <defs>
    <radialGradient id="bgGlow_silk" cx="50%" cy="50%" r="55%">
      <stop offset="0%" stop-color="#E0CCA6" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#080705" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="silkCream" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#383027"/>
      <stop offset="35%" stop-color="#6E5F4F"/>
      <stop offset="70%" stop-color="#9E8B75"/>
      <stop offset="100%" stop-color="#383027"/>
    </linearGradient>
    <linearGradient id="pearlGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF8ED"/>
      <stop offset="50%" stop-color="#E0CCA6"/>
      <stop offset="100%" stop-color="#9C8762"/>
    </linearGradient>
    <filter id="shadow_silk" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="25" stdDeviation="30" flood-color="#000000" flood-opacity="0.95"/>
    </filter>
  </defs>

  <rect width="600" height="800" fill="#080705"/>
  <circle cx="300" cy="460" r="280" fill="url(#bgGlow_silk)"/>
  <ellipse cx="300" cy="720" rx="160" ry="22" fill="#000000" opacity="0.95" filter="url(#shadow_silk)"/>

  <g filter="url(#shadow_silk)">
    <!-- Slender Tear Drop Cap -->
    <path d="M300,100 C320,130 330,160 300,190 C270,160 280,130 300,100 Z" fill="url(#pearlGold)" stroke="#FFF" stroke-width="1.5"/>

    <!-- Amphora Elegant Curvaceous Body -->
    <path d="M250,210 C200,280 180,480 300,680 C420,480 400,280 350,210 Z" fill="url(#silkCream)" stroke="url(#pearlGold)" stroke-width="2.5"/>

    <!-- Golden Wire Filigree Vines -->
    <path d="M220,380 Q300,450 380,380" fill="none" stroke="url(#pearlGold)" stroke-width="2"/>
    <path d="M240,480 Q300,550 360,480" fill="none" stroke="url(#pearlGold)" stroke-width="2"/>

    <!-- Pearl Cartouche Badge -->
    <ellipse cx="300" cy="410" rx="80" ry="60" fill="#1A1510" stroke="url(#pearlGold)" stroke-width="2"/>

    <text x="300" y="395" font-family="'Cinzel', serif" font-size="10" fill="#E0CCA6" text-anchor="middle" letter-spacing="3">ROYAL RESERVE</text>
    <text x="300" y="425" font-family="'Cinzel', serif" font-size="16" font-weight="bold" fill="#FFFFFF" text-anchor="middle" letter-spacing="3">SILK MUSK</text>
    <text x="300" y="450" font-family="'Montserrat', sans-serif" font-size="7.5" fill="#E0CCA6" text-anchor="middle" letter-spacing="2">WHITE LILY &amp; CASHMERE</text>
  </g>
</svg>