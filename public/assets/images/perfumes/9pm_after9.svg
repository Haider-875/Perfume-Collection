<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 800" width="100%" height="100%">
  <defs>
    <radialGradient id="bgGlow_after9" cx="50%" cy="50%" r="55%">
      <stop offset="0%" stop-color="#5B85B8" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#04060A" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="after9Blue" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0A1220"/>
      <stop offset="35%" stop-color="#1B2E4D"/>
      <stop offset="70%" stop-color="#2D4D7E"/>
      <stop offset="100%" stop-color="#0A1220"/>
    </linearGradient>
    <filter id="shadow_after9" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="25" stdDeviation="30" flood-color="#000000" flood-opacity="0.9"/>
    </filter>
  </defs>

  <rect width="600" height="800" fill="#04060A"/>
  <circle cx="300" cy="460" r="280" fill="url(#bgGlow_after9)"/>
  <ellipse cx="300" cy="720" rx="160" ry="22" fill="#000000" opacity="0.95" filter="url(#shadow_after9)"/>

  <g filter="url(#shadow_after9)">
    <!-- Polished Silver Disc Cap -->
    <rect x="250" y="130" width="100" height="60" rx="4" fill="#C5D3E3" stroke="#FFF" stroke-width="1.5"/>
    <rect x="270" y="190" width="60" height="20" fill="#141E2E"/>

    <!-- Rounded Shoulder Monolith Flacon -->
    <rect x="200" y="210" width="200" height="470" rx="30" fill="url(#after9Blue)" stroke="#8AB1DF" stroke-width="2.5"/>

    <!-- High-Shine Vertical Core -->
    <line x1="220" y1="240" x2="220" y2="650" stroke="#FFFFFF" stroke-opacity="0.3" stroke-width="4"/>

    <!-- Bold Central Type Plaque -->
    <rect x="230" y="370" width="140" height="170" rx="8" fill="#080E17" stroke="#8AB1DF" stroke-width="1.5"/>
    <text x="300" y="425" font-family="'Montserrat', sans-serif" font-weight="900" font-size="34" fill="#FFFFFF" text-anchor="middle" letter-spacing="2">9PM</text>
    <text x="300" y="455" font-family="'Cinzel', serif" font-size="12" font-weight="bold" fill="#8AB1DF" text-anchor="middle" letter-spacing="3">AFTER 9</text>
    <line x1="255" y1="472" x2="345" y2="472" stroke="#8AB1DF" stroke-width="1"/>
    <text x="300" y="500" font-family="'Montserrat', sans-serif" font-size="8" fill="#D0E3FC" text-anchor="middle" letter-spacing="2">POUR HOMME</text>
    <text x="300" y="520" font-family="'Cinzel', serif" font-size="7.5" fill="#888" text-anchor="middle" letter-spacing="1">VANILLA &amp; SPICED PEAR</text>
  </g>
</svg>