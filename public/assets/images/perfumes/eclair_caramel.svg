<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 800" width="100%" height="100%">
  <defs>
    <radialGradient id="bgGlow_eclair" cx="50%" cy="50%" r="55%">
      <stop offset="0%" stop-color="#E5A86D" stop-opacity="0.32"/>
      <stop offset="100%" stop-color="#0E0704" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="caramelBody" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#4A2612"/>
      <stop offset="35%" stop-color="#8C4A23"/>
      <stop offset="65%" stop-color="#BA6833"/>
      <stop offset="100%" stop-color="#4A2612"/>
    </linearGradient>
    <linearGradient id="creamGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF8E7"/>
      <stop offset="50%" stop-color="#ECC695"/>
      <stop offset="100%" stop-color="#B87D43"/>
    </linearGradient>
    <filter id="shadow_eclair" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="25" stdDeviation="30" flood-color="#000000" flood-opacity="0.9"/>
    </filter>
  </defs>

  <rect width="600" height="800" fill="#0E0704"/>
  <circle cx="300" cy="450" r="290" fill="url(#bgGlow_eclair)"/>
  <ellipse cx="300" cy="720" rx="170" ry="22" fill="#000000" opacity="0.95" filter="url(#shadow_eclair)"/>

  <g filter="url(#shadow_eclair)">
    <!-- Golden Sphere Dome Cap -->
    <ellipse cx="300" cy="170" rx="55" ry="55" fill="url(#creamGold)" stroke="#FFF8E7" stroke-width="2"/>
    <ellipse cx="280" cy="150" rx="18" ry="12" fill="#FFFFFF" fill-opacity="0.4" transform="rotate(-30 280 150)"/>
    
    <!-- Neck Collar with Draped Ribbon Ring -->
    <rect x="260" y="225" width="80" height="25" rx="5" fill="url(#creamGold)"/>
    <path d="M260,250 C280,265 320,265 340,250 L340,260 C320,275 280,275 260,260 Z" fill="#D9822B"/>

    <!-- Soft Curved Pillowy/Cylindrical Bottle -->
    <path d="M190,280 C190,250 410,250 410,280 L420,640 C420,690 180,690 180,640 Z" fill="url(#caramelBody)" stroke="url(#creamGold)" stroke-width="2.5"/>

    <!-- Caramel Swirl Accents -->
    <path d="M195,330 Q300,380 405,330 Q300,420 195,370" fill="none" stroke="#FCE8C3" stroke-opacity="0.3" stroke-width="3"/>
    <path d="M190,610 Q300,640 410,610" fill="none" stroke="#FCE8C3" stroke-opacity="0.2" stroke-width="2"/>

    <!-- Fluted Cream Oval Label -->
    <ellipse cx="300" cy="480" rx="95" ry="105" fill="#1C0E07" stroke="url(#creamGold)" stroke-width="2"/>
    <ellipse cx="300" cy="480" rx="87" ry="97" fill="none" stroke="url(#creamGold)" stroke-opacity="0.4" stroke-width="1" stroke-dasharray="4,4"/>

    <text x="300" y="440" font-family="'Cinzel', serif" font-size="10" fill="#E5B17A" text-anchor="middle" letter-spacing="4">MAISON GOURMAND</text>
    <circle cx="300" cy="455" r="3" fill="#ECC695"/>
    <text x="300" y="485" font-family="'Cinzel', serif" font-size="18" font-weight="bold" fill="#FFF8E7" text-anchor="middle" letter-spacing="2">ECLAIR</text>
    <text x="300" y="508" font-family="'Montserrat', sans-serif" font-size="8.5" font-weight="600" fill="#E5A86D" text-anchor="middle" letter-spacing="2">CARAMEL FANTASY</text>
    <text x="300" y="530" font-family="'Montserrat', sans-serif" font-size="7" fill="#C49B72" text-anchor="middle" letter-spacing="1.5">DULCE DE LECHE &amp; VANILLE</text>
    <text x="300" y="555" font-family="'Cinzel', serif" font-size="8" fill="#FFFFFF" fill-opacity="0.7" text-anchor="middle" letter-spacing="2">50 ML • EXTRAIT</text>
  </g>
</svg>