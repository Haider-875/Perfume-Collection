<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 800" width="100%" height="100%">
  <defs>
    <radialGradient id="bgGlow_9pmnight" cx="50%" cy="50%" r="55%">
      <stop offset="0%" stop-color="#8359B8" stop-opacity="0.38"/>
      <stop offset="100%" stop-color="#050308" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="nightViolet" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#120A24"/>
      <stop offset="35%" stop-color="#2D1B54"/>
      <stop offset="70%" stop-color="#482E80"/>
      <stop offset="100%" stop-color="#120A24"/>
    </linearGradient>
    <linearGradient id="neonPurple" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#D6A4FF"/>
      <stop offset="50%" stop-color="#9C59EB"/>
      <stop offset="100%" stop-color="#552199"/>
    </linearGradient>
    <filter id="shadow_9pmnight" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="25" stdDeviation="30" flood-color="#000000" flood-opacity="0.9"/>
    </filter>
  </defs>

  <rect width="600" height="800" fill="#050308"/>
  <circle cx="300" cy="460" r="280" fill="url(#bgGlow_9pmnight)"/>
  <ellipse cx="300" cy="730" rx="160" ry="22" fill="#000000" opacity="0.95" filter="url(#shadow_9pmnight)"/>

  <g filter="url(#shadow_9pmnight)">
    <!-- Heavy Beveled Magnetic Cap -->
    <polygon points="230,120 370,120 350,190 250,190" fill="#1C1430" stroke="url(#neonPurple)" stroke-width="2"/>
    <line x1="300" y1="120" x2="300" y2="190" stroke="url(#neonPurple)" stroke-width="1.5"/>

    <!-- Sleek Tall Monolith Flacon Body -->
    <polygon points="210,210 390,210 420,680 180,680" fill="url(#nightViolet)" stroke="url(#neonPurple)" stroke-width="2.5"/>

    <!-- Glowing Neon Edge Ribs -->
    <line x1="210" y1="210" x2="180" y2="680" stroke="#E2B8FF" stroke-width="3" stroke-linecap="round"/>
    <line x1="390" y1="210" x2="420" y2="680" stroke="#E2B8FF" stroke-width="3" stroke-linecap="round"/>

    <!-- Digital Style Night Out Emblem -->
    <rect x="230" y="360" width="140" height="180" rx="10" fill="#0D061A" stroke="url(#neonPurple)" stroke-width="2"/>
    
    <text x="300" y="420" font-family="'Montserrat', sans-serif" font-weight="900" font-size="34" fill="#FFFFFF" text-anchor="middle" letter-spacing="3">9PM</text>
    <text x="300" y="450" font-family="'Cinzel', serif" font-size="11" font-weight="bold" fill="#D6A4FF" text-anchor="middle" letter-spacing="3">NIGHT OUT</text>
    <line x1="250" y1="465" x2="350" y2="465" stroke="url(#neonPurple)" stroke-width="1.5"/>
    <text x="300" y="495" font-family="'Montserrat', sans-serif" font-size="8" fill="#B784EB" text-anchor="middle" letter-spacing="2">EXCLUSIVE EDITION</text>
    <text x="300" y="520" font-family="'Cinzel', serif" font-size="7.5" fill="#888" text-anchor="middle" letter-spacing="1">EXTRAIT DE PARFUM</text>
  </g>
</svg>