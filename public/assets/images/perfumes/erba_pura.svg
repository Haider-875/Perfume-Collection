<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 800" width="100%" height="100%">
  <defs>
    <radialGradient id="bgGlow_erba" cx="50%" cy="50%" r="55%">
      <stop offset="0%" stop-color="#389E78" stop-opacity="0.38"/>
      <stop offset="100%" stop-color="#020805" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="emeraldVelvet" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0B2117"/>
      <stop offset="35%" stop-color="#14422F"/>
      <stop offset="70%" stop-color="#236B4D"/>
      <stop offset="100%" stop-color="#0B2117"/>
    </linearGradient>
    <linearGradient id="sultanGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF3D0"/>
      <stop offset="50%" stop-color="#D4AF37"/>
      <stop offset="100%" stop-color="#8C6819"/>
    </linearGradient>
    <filter id="shadow_erba" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="25" stdDeviation="30" flood-color="#000000" flood-opacity="0.95"/>
    </filter>
  </defs>

  <rect width="600" height="800" fill="#020805"/>
  <circle cx="300" cy="460" r="280" fill="url(#bgGlow_erba)"/>
  <ellipse cx="300" cy="720" rx="160" ry="22" fill="#000000" opacity="0.95" filter="url(#shadow_erba)"/>

  <g filter="url(#shadow_erba)">
    <!-- Tall Sculpted Royal Sultan Gold Cap -->
    <path d="M300,80 Q340,130 330,180 L270,180 Q260,130 300,80 Z" fill="url(#sultanGold)" stroke="#FFF" stroke-width="1.5"/>

    <!-- Slender Emerald Velvet Flocked Flacon -->
    <path d="M250,190 L350,190 L410,310 L390,680 L210,680 L190,310 Z" fill="url(#emeraldVelvet)" stroke="url(#sultanGold)" stroke-width="2.5"/>

    <!-- Roman Laurels Golden Medallion -->
    <rect x="225" y="370" width="150" height="190" rx="4" fill="#071710" stroke="url(#sultanGold)" stroke-width="2"/>
    <circle cx="300" cy="410" r="18" fill="none" stroke="url(#sultanGold)" stroke-width="1.5"/>
    
    <text x="300" y="450" font-family="'Cinzel', serif" font-size="16" font-weight="bold" fill="#FFFFFF" text-anchor="middle" letter-spacing="3">ERBA PURA</text>
    <text x="300" y="478" font-family="'Montserrat', sans-serif" font-size="8.5" fill="#5CC9A1" text-anchor="middle" letter-spacing="2">ROMAN MEMORY</text>
    <line x1="250" y1="500" x2="350" y2="500" stroke="url(#sultanGold)" stroke-width="1"/>
    <text x="300" y="525" font-family="'Montserrat', sans-serif" font-size="7.5" fill="#DDD" text-anchor="middle" letter-spacing="1">CITRUS &amp; WHITE MUSK</text>
  </g>
</svg>