<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 800" width="100%" height="100%">
  <defs>
    <radialGradient id="bgGlow_bloom" cx="50%" cy="50%" r="55%">
      <stop offset="0%" stop-color="#D9828C" stop-opacity="0.32"/>
      <stop offset="100%" stop-color="#080405" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="rosePorcelain" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#B86F77"/>
      <stop offset="25%" stop-color="#D98A92"/>
      <stop offset="75%" stop-color="#E8A0A8"/>
      <stop offset="100%" stop-color="#B86F77"/>
    </linearGradient>
    <filter id="shadow_bloom" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="25" stdDeviation="30" flood-color="#000000" flood-opacity="0.9"/>
    </filter>
  </defs>

  <rect width="600" height="800" fill="#080405"/>
  <circle cx="300" cy="460" r="280" fill="url(#bgGlow_bloom)"/>
  <ellipse cx="300" cy="720" rx="170" ry="22" fill="#000000" opacity="0.95" filter="url(#shadow_bloom)"/>

  <g filter="url(#shadow_bloom)">
    <!-- Stepped Rectangular Lacquer Cap -->
    <rect x="250" y="140" width="100" height="70" rx="3" fill="url(#rosePorcelain)" stroke="#9C525A" stroke-width="1.5"/>
    <rect x="270" y="210" width="60" height="20" fill="#7D3B43"/>

    <!-- Solid Minimalist Powder-Pink Porcelain Rectangular Body -->
    <rect x="180" y="230" width="240" height="450" rx="6" fill="url(#rosePorcelain)" stroke="#9C525A" stroke-width="2"/>

    <!-- Vintage Framed Herbarium Label with Black Border -->
    <rect x="215" y="340" width="170" height="230" rx="2" fill="#FFF9F5" stroke="#1A1A1A" stroke-width="2.5"/>
    <rect x="221" y="346" width="158" height="218" rx="1" fill="none" stroke="#1A1A1A" stroke-width="1"/>
    
    <!-- Vintage Floral Corner Motifs -->
    <path d="M225,355 L235,355 M225,355 L225,365" stroke="#1A1A1A" stroke-width="1.5"/>
    <path d="M375,355 L365,355 M375,355 L375,365" stroke="#1A1A1A" stroke-width="1.5"/>
    <path d="M225,555 L235,555 M225,555 L225,545" stroke="#1A1A1A" stroke-width="1.5"/>
    <path d="M375,555 L365,555 M375,555 L375,545" stroke="#1A1A1A" stroke-width="1.5"/>

    <text x="300" y="405" font-family="'Cinzel', 'Playfair Display', serif" font-size="14" font-weight="bold" fill="#1A1A1A" text-anchor="middle" letter-spacing="5">GUCCI</text>
    <line x1="255" y1="420" x2="345" y2="420" stroke="#1A1A1A" stroke-width="0.8"/>
    <text x="300" y="455" font-family="'Cinzel', serif" font-size="20" font-weight="bold" fill="#1A1A1A" text-anchor="middle" letter-spacing="3">BLOOM</text>
    <text x="300" y="485" font-family="'Montserrat', sans-serif" font-size="8" font-weight="bold" fill="#7D3B43" text-anchor="middle" letter-spacing="2">EAU DE PARFUM</text>
    <text x="300" y="525" font-family="'Cinzel', serif" font-size="7.5" fill="#555555" text-anchor="middle" letter-spacing="2">NATURAL TUBEROSE</text>
  </g>
</svg>