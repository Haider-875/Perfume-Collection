<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 800" width="100%" height="100%">
  <defs>
    <radialGradient id="bgGlow_tuscan" cx="50%" cy="50%" r="55%">
      <stop offset="0%" stop-color="#D4AF37" stop-opacity="0.32"/>
      <stop offset="100%" stop-color="#050203" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="oxbloodGlass" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1F0A0D"/>
      <stop offset="35%" stop-color="#3D141A"/>
      <stop offset="70%" stop-color="#5E1F28"/>
      <stop offset="100%" stop-color="#1F0A0D"/>
    </linearGradient>
    <linearGradient id="goldLabel" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF3D0"/>
      <stop offset="50%" stop-color="#D4AF37"/>
      <stop offset="100%" stop-color="#8C6819"/>
    </linearGradient>
    <filter id="shadow_tuscan" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="25" stdDeviation="30" flood-color="#000000" flood-opacity="0.95"/>
    </filter>
  </defs>

  <rect width="600" height="800" fill="#050203"/>
  <circle cx="300" cy="460" r="280" fill="url(#bgGlow_tuscan)"/>
  <ellipse cx="300" cy="720" rx="160" ry="22" fill="#000000" opacity="0.95" filter="url(#shadow_tuscan)"/>

  <g filter="url(#shadow_tuscan)">
    <!-- Iconic Architectural Flared Capital Top Cap (Chess Pawn/Column) -->
    <polygon points="230,100 370,100 350,160 250,160" fill="url(#oxbloodGlass)" stroke="url(#goldLabel)" stroke-width="1.5"/>
    <rect x="255" y="160" width="90" height="30" fill="#140608"/>

    <!-- Architectural Square Column Body with Heavy Stepped Pedestal Base -->
    <rect x="210" y="190" width="180" height="430" fill="url(#oxbloodGlass)" stroke="url(#goldLabel)" stroke-width="2"/>
    <rect x="195" y="620" width="210" height="40" rx="3" fill="url(#oxbloodGlass)" stroke="url(#goldLabel)" stroke-width="2"/>

    <!-- Brass Inset Plate Label -->
    <rect x="225" y="320" width="150" height="190" rx="3" fill="url(#goldLabel)" stroke="#FFFFFF" stroke-width="1"/>
    <rect x="230" y="325" width="140" height="180" rx="2" fill="#1C090C"/>

    <text x="300" y="365" font-family="'Cinzel', serif" font-size="10" fill="#E5C158" text-anchor="middle" letter-spacing="3">PRIVATE BLEND</text>
    <text x="300" y="405" font-family="'Cinzel', serif" font-size="15" font-weight="bold" fill="#FFF3D0" text-anchor="middle" letter-spacing="2">TUSCAN</text>
    <text x="300" y="430" font-family="'Cinzel', serif" font-size="15" font-weight="bold" fill="#FFF3D0" text-anchor="middle" letter-spacing="2">LEATHER</text>
    <line x1="250" y1="448" x2="350" y2="448" stroke="url(#goldLabel)" stroke-width="0.8"/>
    <text x="300" y="470" font-family="'Montserrat', sans-serif" font-size="7.5" fill="#D4AF37" text-anchor="middle" letter-spacing="1.5">LEATHER TEMPTATION</text>
    <text x="300" y="492" font-family="'Cinzel', serif" font-size="7" fill="#888" text-anchor="middle" letter-spacing="1">EAU DE PARFUM</text>
  </g>
</svg>