<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 800" width="100%" height="100%">
  <defs>
    <radialGradient id="bgGlow_sentinal" cx="50%" cy="50%" r="55%">
      <stop offset="0%" stop-color="#D4AF37" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#040305" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="obsidianGlass" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0F1114"/>
      <stop offset="35%" stop-color="#1E2329"/>
      <stop offset="70%" stop-color="#2D343D"/>
      <stop offset="100%" stop-color="#0F1114"/>
    </linearGradient>
    <linearGradient id="sentinalGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF3D0"/>
      <stop offset="50%" stop-color="#D4AF37"/>
      <stop offset="100%" stop-color="#8C6819"/>
    </linearGradient>
    <filter id="shadow_sentinal" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="25" stdDeviation="30" flood-color="#000000" flood-opacity="0.95"/>
    </filter>
  </defs>

  <rect width="600" height="800" fill="#040305"/>
  <circle cx="300" cy="460" r="280" fill="url(#bgGlow_sentinal)"/>
  <ellipse cx="300" cy="720" rx="170" ry="22" fill="#000000" opacity="0.95" filter="url(#shadow_sentinal)"/>

  <g filter="url(#shadow_sentinal)">
    <!-- Solid Gold Shielded Cap -->
    <rect x="230" y="120" width="140" height="80" rx="5" fill="url(#sentinalGold)" stroke="#FFF" stroke-width="1.5"/>
    <circle cx="300" cy="160" r="15" fill="#14171A" stroke="url(#sentinalGold)" stroke-width="1.5"/>
    <polygon points="295,165 300,152 305,165" fill="url(#sentinalGold)"/>

    <!-- Obsidian Monolith Body -->
    <rect x="180" y="220" width="240" height="460" rx="10" fill="url(#obsidianGlass)" stroke="url(#sentinalGold)" stroke-width="2.5"/>

    <!-- Gold Filigree Metal Corners -->
    <polygon points="180,220 220,220 180,260" fill="url(#sentinalGold)"/>
    <polygon points="420,220 380,220 420,260" fill="url(#sentinalGold)"/>
    <polygon points="180,680 220,680 180,640" fill="url(#sentinalGold)"/>
    <polygon points="420,680 380,680 420,640" fill="url(#sentinalGold)"/>

    <!-- Knight / Sentinel Sovereign Crest -->
    <rect x="215" y="360" width="170" height="200" rx="6" fill="#0B0C0E" stroke="url(#sentinalGold)" stroke-width="2"/>
    <polygon points="300,380 330,410 300,450 270,410" fill="url(#sentinalGold)" opacity="0.8"/>
    
    <text x="300" y="485" font-family="'Cinzel', serif" font-size="18" font-weight="bold" fill="#FFFFFF" text-anchor="middle" letter-spacing="3">SENTINAL</text>
    <text x="300" y="510" font-family="'Montserrat', sans-serif" font-size="8" fill="#D4AF37" text-anchor="middle" letter-spacing="2">PRIVATE RESERVE</text>
    <text x="300" y="535" font-family="'Cinzel', serif" font-size="7.5" fill="#888" text-anchor="middle" letter-spacing="1">EXTRAIT DE PARFUM</text>
  </g>
</svg>