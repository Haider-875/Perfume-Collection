<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 800" width="100%" height="100%">
  <defs>
    <radialGradient id="bgGlow_afnan" cx="50%" cy="50%" r="55%">
      <stop offset="0%" stop-color="#9EADC0" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#050709" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="chromeSilver" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="25%" stop-color="#B0C0D0"/>
      <stop offset="50%" stop-color="#4A5868"/>
      <stop offset="75%" stop-color="#E2EAF2"/>
      <stop offset="100%" stop-color="#7B8B9C"/>
    </linearGradient>
    <linearGradient id="slateFlask" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0E1217"/>
      <stop offset="35%" stop-color="#242D38"/>
      <stop offset="65%" stop-color="#3D4B5C"/>
      <stop offset="100%" stop-color="#0E1217"/>
    </linearGradient>
    <filter id="shadow_afnan" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="25" stdDeviation="30" flood-color="#000000" flood-opacity="0.9"/>
    </filter>
  </defs>

  <rect width="600" height="800" fill="#050709"/>
  <circle cx="300" cy="460" r="280" fill="url(#bgGlow_afnan)"/>
  <ellipse cx="300" cy="720" rx="170" ry="22" fill="#000000" opacity="0.95" filter="url(#shadow_afnan)"/>

  <g filter="url(#shadow_afnan)">
    <!-- Slanted Heavy Chrome Cap -->
    <path d="M250,140 L350,120 L350,190 L250,190 Z" fill="url(#chromeSilver)" stroke="#FFFFFF" stroke-width="1.5"/>
    <rect x="270" y="190" width="60" height="25" fill="#14181E"/>

    <!-- Asymmetric Shield Curved Flask Body -->
    <path d="M190,270 C190,220 300,210 410,240 C430,400 420,620 390,680 C320,700 240,690 190,650 C170,550 170,350 190,270 Z" fill="url(#slateFlask)" stroke="url(#chromeSilver)" stroke-width="2.5"/>

    <!-- High-Shine Metallic Highlight Rib -->
    <path d="M210,260 C210,380 200,560 215,640" fill="none" stroke="#FFFFFF" stroke-opacity="0.4" stroke-width="3"/>

    <!-- Metallic Supremacy Crest Medallion -->
    <circle cx="300" cy="430" r="50" fill="url(#chromeSilver)" stroke="#FFFFFF" stroke-width="2"/>
    <circle cx="300" cy="430" r="42" fill="#12161C" stroke="url(#chromeSilver)" stroke-width="1.5"/>
    
    <!-- Heraldic Crown Symbol -->
    <path d="M280,435 L285,415 L300,425 L315,415 L320,435 Z" fill="url(#chromeSilver)"/>
    <circle cx="285" cy="412" r="2" fill="#FFF"/>
    <circle cx="300" cy="420" r="2.5" fill="#FFF"/>
    <circle cx="315" cy="412" r="2" fill="#FFF"/>

    <!-- Text Engraving Below Medallion -->
    <text x="300" y="525" font-family="'Cinzel', serif" font-size="16" font-weight="bold" fill="#FFFFFF" text-anchor="middle" letter-spacing="2">SUPREMACY</text>
    <text x="300" y="548" font-family="'Montserrat', sans-serif" font-size="9" fill="#B0C0D0" text-anchor="middle" letter-spacing="3">AFNAN POUR HOMME</text>
    <text x="300" y="570" font-family="'Montserrat', sans-serif" font-size="7.5" fill="#7B8B9C" text-anchor="middle" letter-spacing="1.5">SMOKY BIRCH &amp; PINEAPPLE</text>
  </g>
</svg>