<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 800" width="100%" height="100%">
  <defs>
    <radialGradient id="bgGlow_khumrah" cx="50%" cy="50%" r="55%">
      <stop offset="0%" stop-color="#D4AF37" stop-opacity="0.35"/>
      <stop offset="60%" stop-color="#3A1C08" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#080402" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="amberLiquid" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFB347"/>
      <stop offset="40%" stop-color="#D97706"/>
      <stop offset="80%" stop-color="#78350F"/>
      <stop offset="100%" stop-color="#3B1705"/>
    </linearGradient>
    <linearGradient id="crystalGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF3D0"/>
      <stop offset="35%" stop-color="#D4AF37"/>
      <stop offset="70%" stop-color="#8C6819"/>
      <stop offset="100%" stop-color="#FFEAA7"/>
    </linearGradient>
    <filter id="shadow_khumrah" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="30" stdDeviation="35" flood-color="#000000" flood-opacity="0.9"/>
    </filter>
  </defs>

  <rect width="600" height="800" fill="#080402"/>
  <circle cx="300" cy="460" r="300" fill="url(#bgGlow_khumrah)"/>
  <ellipse cx="300" cy="730" rx="180" ry="25" fill="#020101" opacity="0.95" filter="url(#shadow_khumrah)"/>

  <g filter="url(#shadow_khumrah)">
    <!-- Heavy Octagonal Faceted Stopper -->
    <polygon points="230,130 270,90 330,90 370,130 370,190 330,230 270,230 230,190" fill="url(#crystalGold)" stroke="#FFF3D0" stroke-width="2"/>
    <polygon points="250,140 280,110 320,110 350,140 350,180 320,210 280,210 250,180" fill="#24140A" stroke="url(#crystalGold)" stroke-width="1.5"/>
    <circle cx="300" cy="160" r="18" fill="none" stroke="url(#crystalGold)" stroke-width="1.5"/>
    <text x="300" y="165" font-family="'Cinzel', serif" font-size="12" fill="#FFEAA7" text-anchor="middle" font-weight="bold">LK</text>

    <!-- Golden Neck Collar -->
    <rect x="265" y="230" width="70" height="30" rx="3" fill="url(#crystalGold)" stroke="#78350F" stroke-width="1"/>
    <line x1="265" y1="245" x2="335" y2="245" stroke="#FFFFFF" stroke-opacity="0.6" stroke-width="1.5"/>

    <!-- Cut-Glass Tumbler Decanter Body (Heavy square with beveled edges) -->
    <path d="M170,270 L430,270 L410,690 L190,690 Z" fill="url(#amberLiquid)" stroke="url(#crystalGold)" stroke-width="2.5"/>

    <!-- Cut Crystal Diamond Facets Pattern -->
    <g stroke="#FFFFFF" stroke-opacity="0.3" stroke-width="1.5" fill="none">
      <line x1="170" y1="360" x2="430" y2="360"/>
      <line x1="175" y1="450" x2="425" y2="450"/>
      <line x1="180" y1="540" x2="420" y2="540"/>
      <line x1="185" y1="630" x2="415" y2="630"/>

      <!-- Cross Diamond Grooves -->
      <line x1="210" y1="270" x2="270" y2="360"/>
      <line x1="270" y1="270" x2="330" y2="360"/>
      <line x1="330" y1="270" x2="390" y2="360"/>
      <line x1="390" y1="270" x2="330" y2="360"/>

      <line x1="270" y1="360" x2="215" y2="450"/>
      <line x1="330" y1="360" x2="275" y2="450"/>
      <line x1="390" y1="360" x2="335" y2="450"/>
      <line x1="215" y1="450" x2="280" y2="540"/>
      <line x1="275" y1="450" x2="340" y2="540"/>
      <line x1="335" y1="450" x2="400" y2="540"/>
      <line x1="280" y1="540" x2="225" y2="630"/>
      <line x1="340" y1="540" x2="285" y2="630"/>
      <line x1="400" y1="540" x2="345" y2="630"/>
    </g>

    <!-- Crystal Base Slab -->
    <rect x="180" y="670" width="240" height="25" fill="#FFFFFF" fill-opacity="0.15" stroke="url(#crystalGold)" stroke-width="1.5"/>

    <!-- Central Plaque Plate -->
    <rect x="210" y="440" width="180" height="150" rx="6" fill="#120A05" stroke="url(#crystalGold)" stroke-width="2"/>
    <rect x="218" y="448" width="164" height="134" rx="3" fill="none" stroke="url(#crystalGold)" stroke-opacity="0.4" stroke-width="1"/>
    
    <text x="300" y="480" font-family="'Cinzel', serif" font-size="10" fill="#E5C158" text-anchor="middle" letter-spacing="3">LATTAFA</text>
    <text x="300" y="508" font-family="'Cinzel', serif" font-size="14" font-weight="bold" fill="#FFF3D0" text-anchor="middle" letter-spacing="2">KHUMRAH</text>
    <text x="300" y="528" font-family="'Montserrat', sans-serif" font-size="7.5" fill="#D4AF37" text-anchor="middle" letter-spacing="2">MIDNIGHT OUD EXCLUSIVE</text>
    <line x1="250" y1="542" x2="350" y2="542" stroke="url(#crystalGold)" stroke-width="0.8"/>
    <text x="300" y="562" font-family="'Montserrat', sans-serif" font-size="7" fill="#CCCCCC" text-anchor="middle" letter-spacing="1.5">EXTRAIT DE PARFUM • 50 ML</text>
  </g>
</svg>