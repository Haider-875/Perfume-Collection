<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 800" width="100%" height="100%">
  <defs>
    <radialGradient id="bgGlow_ombre" cx="50%" cy="50%" r="55%">
      <stop offset="0%" stop-color="#555555" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#020202" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="matteLeather" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#141414"/>
      <stop offset="40%" stop-color="#222222"/>
      <stop offset="70%" stop-color="#2B2B2B"/>
      <stop offset="100%" stop-color="#141414"/>
    </linearGradient>
    <filter id="shadow_ombre" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="25" stdDeviation="30" flood-color="#000000" flood-opacity="0.95"/>
    </filter>
  </defs>

  <rect width="600" height="800" fill="#020202"/>
  <circle cx="300" cy="460" r="280" fill="url(#bgGlow_ombre)"/>
  <ellipse cx="300" cy="720" rx="160" ry="22" fill="#000000" opacity="0.95" filter="url(#shadow_ombre)"/>

  <g filter="url(#shadow_ombre)">
    <!-- Flush Matte Flat Cylindrical Cap -->
    <rect x="250" y="140" width="100" height="60" rx="4" fill="#1C1C1C" stroke="#333" stroke-width="1.5"/>
    
    <!-- Heavy Solid Matte Black Flask Body -->
    <rect x="200" y="200" width="200" height="480" rx="12" fill="url(#matteLeather)" stroke="#444" stroke-width="2"/>

    <!-- Inset White Faux Leather Texture Patch -->
    <rect x="220" y="340" width="160" height="220" rx="4" fill="#0A0A0A" stroke="#262626" stroke-width="2"/>
    <rect x="225" y="345" width="150" height="210" rx="2" fill="none" stroke="#333" stroke-dasharray="3,3" stroke-width="1"/>

    <text x="300" y="395" font-family="'Cinzel', serif" font-size="11" fill="#888" text-anchor="middle" letter-spacing="4">TOM FORD</text>
    <text x="300" y="435" font-family="'Cinzel', serif" font-size="16" font-weight="bold" fill="#FFF" text-anchor="middle" letter-spacing="2">OMBRÉ</text>
    <text x="300" y="465" font-family="'Cinzel', serif" font-size="16" font-weight="bold" fill="#FFF" text-anchor="middle" letter-spacing="2">LEATHER</text>
    <line x1="260" y1="485" x2="340" y2="485" stroke="#444" stroke-width="1"/>
    <text x="300" y="510" font-family="'Montserrat', sans-serif" font-size="8" fill="#AAA" text-anchor="middle" letter-spacing="2">THE LEATHER</text>
    <text x="300" y="535" font-family="'Cinzel', serif" font-size="7" fill="#666" text-anchor="middle" letter-spacing="1">50 ML • 1.7 FL.OZ</text>
  </g>
</svg>