<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 800" width="100%" height="100%">
  <defs>
    <radialGradient id="bgGlow_sports" cx="50%" cy="50%" r="55%">
      <stop offset="0%" stop-color="#3EA8B8" stop-opacity="0.38"/>
      <stop offset="100%" stop-color="#020608" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="sportsAqua" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0D2026"/>
      <stop offset="35%" stop-color="#1B424F"/>
      <stop offset="70%" stop-color="#2D6E82"/>
      <stop offset="100%" stop-color="#0D2026"/>
    </linearGradient>
    <linearGradient id="neonCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="50%" stop-color="#4FE3F5"/>
      <stop offset="100%" stop-color="#137887"/>
    </linearGradient>
    <filter id="shadow_sports" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="25" stdDeviation="30" flood-color="#000000" flood-opacity="0.95"/>
    </filter>
  </defs>

  <rect width="600" height="800" fill="#020608"/>
  <circle cx="300" cy="460" r="280" fill="url(#bgGlow_sports)"/>
  <ellipse cx="300" cy="720" rx="160" ry="22" fill="#000000" opacity="0.95" filter="url(#shadow_sports)"/>

  <g filter="url(#shadow_sports)">
    <!-- Aerodynamic Vapor Cap -->
    <polygon points="250,130 350,130 370,190 230,190" fill="#142830" stroke="url(#neonCyan)" stroke-width="2"/>

    <!-- Ergonomic Sports Flask with Carbon Grips -->
    <path d="M210,210 Q170,440 210,680 L390,680 Q430,440 390,210 Z" fill="url(#sportsAqua)" stroke="url(#neonCyan)" stroke-width="2.5"/>

    <!-- Performance Speed Slits -->
    <g stroke="#4FE3F5" stroke-width="3" stroke-linecap="round">
      <line x1="190" y1="360" x2="220" y2="360"/>
      <line x1="185" y1="410" x2="215" y2="410"/>
      <line x1="190" y1="460" x2="220" y2="460"/>
      <line x1="410" y1="360" x2="380" y2="360"/>
      <line x1="415" y1="410" x2="385" y2="410"/>
      <line x1="410" y1="460" x2="380" y2="460"/>
    </g>

    <!-- Sports 91 Core Badge -->
    <rect x="230" y="370" width="140" height="170" rx="10" fill="#071317" stroke="url(#neonCyan)" stroke-width="2"/>

    <text x="300" y="425" font-family="'Montserrat', sans-serif" font-weight="900" font-size="34" fill="#FFFFFF" text-anchor="middle" letter-spacing="3">91</text>
    <text x="300" y="460" font-family="'Cinzel', serif" font-size="14" font-weight="bold" fill="#4FE3F5" text-anchor="middle" letter-spacing="4">SPORTS</text>
    <line x1="255" y1="480" x2="345" y2="480" stroke="#4FE3F5" stroke-width="1.5"/>
    <text x="300" y="505" font-family="'Montserrat', sans-serif" font-size="8" fill="#AAA" text-anchor="middle" letter-spacing="1.5">PERFORMANCE EXTRAIT</text>
  </g>
</svg>