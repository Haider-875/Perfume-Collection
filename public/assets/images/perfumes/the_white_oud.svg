<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 800" width="100%" height="100%">
  <defs>
    <radialGradient id="bgGlow_whiteoud" cx="50%" cy="50%" r="55%">
      <stop offset="0%" stop-color="#D4AF37" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#050608" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="alabasterWhite" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#D9E0E8"/>
      <stop offset="35%" stop-color="#FFFFFF"/>
      <stop offset="70%" stop-color="#F2F5F8"/>
      <stop offset="100%" stop-color="#D9E0E8"/>
    </linearGradient>
    <linearGradient id="goldFiligree" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF3D0"/>
      <stop offset="50%" stop-color="#D4AF37"/>
      <stop offset="100%" stop-color="#8C6819"/>
    </linearGradient>
    <filter id="shadow_whiteoud" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="25" stdDeviation="30" flood-color="#000000" flood-opacity="0.9"/>
    </filter>
  </defs>

  <rect width="600" height="800" fill="#050608"/>
  <circle cx="300" cy="460" r="280" fill="url(#bgGlow_whiteoud)"/>
  <ellipse cx="300" cy="720" rx="160" ry="22" fill="#000000" opacity="0.95" filter="url(#shadow_whiteoud)"/>

  <g filter="url(#shadow_whiteoud)">
    <!-- Polished Gold Filigree Arabic Dome Cap -->
    <path d="M300,100 Q340,150 330,190 L270,190 Q260,150 300,100 Z" fill="url(#goldFiligree)" stroke="#FFF" stroke-width="1.5"/>
    <circle cx="300" cy="95" r="5" fill="#FFEAA7"/>

    <!-- Frosted Alabaster White Cylindrical Flacon -->
    <rect x="200" y="210" width="200" height="470" rx="20" fill="url(#alabasterWhite)" stroke="url(#goldFiligree)" stroke-width="2.5"/>

    <!-- Arabesque Lattice Gold Pattern Bands -->
    <g stroke="url(#goldFiligree)" stroke-width="1.5" fill="none">
      <path d="M200,260 Q250,280 300,260 Q350,280 400,260"/>
      <path d="M200,280 Q250,260 300,280 Q350,260 400,280"/>
      <path d="M200,620 Q250,640 300,620 Q350,640 400,620"/>
      <path d="M200,640 Q250,620 300,640 Q350,620 400,640"/>
    </g>

    <!-- Pristine White & Gold Plaque -->
    <rect x="225" y="360" width="150" height="180" rx="8" fill="#FFFFFF" stroke="url(#goldFiligree)" stroke-width="2"/>
    
    <text x="300" y="410" font-family="'Cinzel', serif" font-size="10" fill="#D4AF37" text-anchor="middle" letter-spacing="3">ROYAL ATELIER</text>
    <text x="300" y="445" font-family="'Cinzel', serif" font-size="16" font-weight="bold" fill="#1A1C20" text-anchor="middle" letter-spacing="2">THE WHITE</text>
    <text x="300" y="475" font-family="'Cinzel', serif" font-size="16" font-weight="bold" fill="#1A1C20" text-anchor="middle" letter-spacing="2">OUD</text>
    <line x1="250" y1="495" x2="350" y2="495" stroke="url(#goldFiligree)" stroke-width="1"/>
    <text x="300" y="518" font-family="'Montserrat', sans-serif" font-size="7.5" fill="#8C6819" text-anchor="middle" letter-spacing="1.5">PURE RESERVE • 50 ML</text>
  </g>
</svg>