<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 800" width="100%" height="100%">
  <defs>
    <radialGradient id="bgGlow_wanted" cx="50%" cy="50%" r="55%">
      <stop offset="0%" stop-color="#D49D48" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#050403" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="gunmetalSteel" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2B2D30"/>
      <stop offset="25%" stop-color="#6E737A"/>
      <stop offset="50%" stop-color="#A4ABB5"/>
      <stop offset="75%" stop-color="#6E737A"/>
      <stop offset="100%" stop-color="#2B2D30"/>
    </linearGradient>
    <linearGradient id="amberElixir" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFBE59"/>
      <stop offset="50%" stop-color="#D48528"/>
      <stop offset="100%" stop-color="#5C330B"/>
    </linearGradient>
    <filter id="shadow_wanted" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="25" stdDeviation="30" flood-color="#000000" flood-opacity="0.95"/>
    </filter>
  </defs>

  <rect width="600" height="800" fill="#050403"/>
  <circle cx="300" cy="460" r="280" fill="url(#bgGlow_wanted)"/>
  <ellipse cx="300" cy="720" rx="160" ry="22" fill="#000000" opacity="0.95" filter="url(#shadow_wanted)"/>

  <g filter="url(#shadow_wanted)">
    <!-- Mechanical Revolver Cylinder Chamber Top Cap with Cartridge Holes -->
    <rect x="200" y="160" width="200" height="150" rx="10" fill="url(#gunmetalSteel)" stroke="#FFF" stroke-width="1.5"/>
    
    <!-- Revolver Bullet Notches (Cylinders) -->
    <g fill="#1A1C1E" stroke="url(#gunmetalSteel)" stroke-width="2">
      <circle cx="235" cy="235" r="18"/>
      <circle cx="300" cy="210" r="18"/>
      <circle cx="365" cy="235" r="18"/>
      <circle cx="265" cy="275" r="18"/>
      <circle cx="335" cy="275" r="18"/>
    </g>

    <!-- Pure Clear Heavy Glass Cylindrical Base with Amber Liquid -->
    <rect x="200" y="310" width="200" height="360" rx="15" fill="url(#amberElixir)" stroke="url(#gunmetalSteel)" stroke-width="2.5"/>

    <!-- Mechanical Medallion Plate -->
    <rect x="225" y="420" width="150" height="160" rx="8" fill="#14110E" stroke="url(#gunmetalSteel)" stroke-width="2"/>

    <text x="300" y="465" font-family="'Cinzel', serif" font-size="12" fill="#D49D48" text-anchor="middle" letter-spacing="3">AZZARO</text>
    <text x="300" y="500" font-family="'Montserrat', sans-serif" font-weight="900" font-size="18" fill="#FFFFFF" text-anchor="middle" letter-spacing="2">WANTED</text>
    <text x="300" y="528" font-family="'Cinzel', serif" font-size="9" fill="#D49D48" text-anchor="middle" letter-spacing="2">MISSION</text>
    <text x="300" y="555" font-family="'Montserrat', sans-serif" font-size="7.5" fill="#888" text-anchor="middle" letter-spacing="1">GINGER &amp; AMBERWOOD</text>
  </g>
</svg>