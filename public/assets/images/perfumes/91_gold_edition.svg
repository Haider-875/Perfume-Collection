<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 800" width="100%" height="100%">
  <defs>
    <radialGradient id="bgGlow_gold91" cx="50%" cy="50%" r="55%">
      <stop offset="0%" stop-color="#FFD700" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#080601" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="pure24kGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFE0"/>
      <stop offset="20%" stop-color="#FFD700"/>
      <stop offset="45%" stop-color="#B8860B"/>
      <stop offset="70%" stop-color="#FFE066"/>
      <stop offset="100%" stop-color="#996515"/>
    </linearGradient>
    <filter id="shadow_gold91" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="25" stdDeviation="35" flood-color="#000000" flood-opacity="0.95"/>
    </filter>
  </defs>

  <rect width="600" height="800" fill="#080601"/>
  <circle cx="300" cy="460" r="290" fill="url(#bgGlow_gold91)"/>
  <ellipse cx="300" cy="720" rx="170" ry="24" fill="#000000" opacity="0.95" filter="url(#shadow_gold91)"/>

  <g filter="url(#shadow_gold91)">
    <!-- 24K Solid Gold Beveled Bullion Cap -->
    <polygon points="230,110 370,110 390,180 210,180" fill="url(#pure24kGold)" stroke="#FFFFFF" stroke-width="2"/>
    <rect x="250" y="180" width="100" height="20" fill="#3D2800"/>

    <!-- High-Carat Gold Bullion Ingot Flacon Body -->
    <polygon points="200,200 400,200 430,680 170,680" fill="url(#pure24kGold)" stroke="#FFFFFF" stroke-width="3"/>

    <!-- Beveled Ingot Edge Reflections -->
    <polygon points="200,200 230,230 230,650 170,680" fill="#000000" fill-opacity="0.25"/>
    <polygon points="400,200 370,230 370,650 430,680" fill="#FFFFFF" fill-opacity="0.35"/>

    <!-- Deep Inset Engraved Bullion Seal -->
    <rect x="220" y="320" width="160" height="250" rx="6" fill="#140E02" stroke="url(#pure24kGold)" stroke-width="2.5"/>
    <rect x="226" y="326" width="148" height="238" rx="3" fill="none" stroke="url(#pure24kGold)" stroke-opacity="0.5" stroke-width="1"/>

    <!-- 24K Gold Stamped Logo -->
    <circle cx="300" cy="365" r="20" fill="none" stroke="url(#pure24kGold)" stroke-width="2"/>
    <text x="300" y="372" font-family="'Cinzel', serif" font-size="12" font-weight="bold" fill="url(#pure24kGold)" text-anchor="middle">24K</text>

    <text x="300" y="420" font-family="'Montserrat', sans-serif" font-weight="900" font-size="34" fill="#FFD700" text-anchor="middle" letter-spacing="3">91</text>
    <text x="300" y="455" font-family="'Cinzel', serif" font-size="14" font-weight="bold" fill="#FFFFFF" text-anchor="middle" letter-spacing="3">GOLD EDITION</text>
    <line x1="250" y1="475" x2="350" y2="475" stroke="url(#pure24kGold)" stroke-width="1.5"/>
    <text x="300" y="500" font-family="'Montserrat', sans-serif" font-size="8.5" fill="#FFE066" text-anchor="middle" letter-spacing="2">ALL EXCLUSIVE RESERVE</text>
    <text x="300" y="530" font-family="'Cinzel', serif" font-size="8" fill="#CCC" text-anchor="middle" letter-spacing="1.5">SAFFRON &amp; AGED AGARWOOD</text>
  </g>
</svg>