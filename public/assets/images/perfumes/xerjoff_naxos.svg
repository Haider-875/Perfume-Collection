<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 800" width="100%" height="100%">
  <defs>
    <radialGradient id="bgGlow_naxos" cx="50%" cy="50%" r="55%">
      <stop offset="0%" stop-color="#D4AF37" stop-opacity="0.38"/>
      <stop offset="100%" stop-color="#080502" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="naxosLiquid" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3B2508"/>
      <stop offset="35%" stop-color="#734B12"/>
      <stop offset="70%" stop-color="#B07823"/>
      <stop offset="100%" stop-color="#3B2508"/>
    </linearGradient>
    <linearGradient id="xerjoffGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF5D6"/>
      <stop offset="40%" stop-color="#D4AF37"/>
      <stop offset="80%" stop-color="#8C6819"/>
      <stop offset="100%" stop-color="#FFEAA7"/>
    </linearGradient>
    <filter id="shadow_naxos" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="25" stdDeviation="30" flood-color="#000000" flood-opacity="0.95"/>
    </filter>
  </defs>

  <rect width="600" height="800" fill="#080502"/>
  <circle cx="300" cy="460" r="280" fill="url(#bgGlow_naxos)"/>
  <ellipse cx="300" cy="730" rx="160" ry="22" fill="#000000" opacity="0.95" filter="url(#shadow_naxos)"/>

  <g filter="url(#shadow_naxos)">
    <!-- Iconic Xerjoff Sculpted Droplet Crown Cap -->
    <path d="M300,70 C330,120 340,160 300,180 C260,160 270,120 300,70 Z" fill="url(#xerjoffGold)" stroke="#FFF" stroke-width="1.5"/>
    <rect x="270" y="180" width="60" height="20" rx="2" fill="url(#xerjoffGold)"/>

    <!-- Sloping Curved Shoulder Xerjoff Silhouette Flacon Body -->
    <path d="M260,200 L340,200 L410,320 L390,680 L210,680 L190,320 Z" fill="url(#naxosLiquid)" stroke="url(#xerjoffGold)" stroke-width="2.5"/>

    <!-- Frosted Glass Finish Grain Line -->
    <line x1="200" y1="320" x2="400" y2="320" stroke="url(#xerjoffGold)" stroke-opacity="0.4" stroke-width="1"/>

    <!-- 1861 Italian Heritage Plaque -->
    <rect x="225" y="380" width="150" height="190" rx="4" fill="#140C04" stroke="url(#xerjoffGold)" stroke-width="2"/>
    
    <!-- Italian Tricolor / X Emblem -->
    <text x="300" y="420" font-family="'Cinzel', serif" font-size="22" font-weight="bold" fill="url(#xerjoffGold)" text-anchor="middle" letter-spacing="4">X</text>
    <text x="300" y="450" font-family="'Cinzel', serif" font-size="11" fill="#E5C158" text-anchor="middle" letter-spacing="4">XERJOFF 1861</text>
    <text x="300" y="485" font-family="'Cinzel', serif" font-size="18" font-weight="bold" fill="#FFFFFF" text-anchor="middle" letter-spacing="3">NAXOS</text>
    <line x1="250" y1="505" x2="350" y2="505" stroke="url(#xerjoffGold)" stroke-width="1"/>
    <text x="300" y="530" font-family="'Montserrat', sans-serif" font-size="8" fill="#D4AF37" text-anchor="middle" letter-spacing="1.5">HONEY &amp; TOBACCO</text>
  </g>
</svg>