<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 800" width="100%" height="100%">
  <defs>
    <radialGradient id="bgGlow_rebel" cx="50%" cy="50%" r="55%">
      <stop offset="0%" stop-color="#C46D47" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#080403" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="rebelGunmetal" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#525E6B"/>
      <stop offset="50%" stop-color="#242B33"/>
      <stop offset="100%" stop-color="#0E1217"/>
    </linearGradient>
    <linearGradient id="rebelFlame" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF6B3D"/>
      <stop offset="50%" stop-color="#A83918"/>
      <stop offset="100%" stop-color="#401205"/>
    </linearGradient>
    <filter id="shadow_rebel" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="25" stdDeviation="30" flood-color="#000000" flood-opacity="0.9"/>
    </filter>
  </defs>

  <rect width="600" height="800" fill="#080403"/>
  <circle cx="300" cy="460" r="280" fill="url(#bgGlow_rebel)"/>
  <ellipse cx="300" cy="720" rx="160" ry="22" fill="#000000" opacity="0.95" filter="url(#shadow_rebel)"/>

  <g filter="url(#shadow_rebel)">
    <!-- Spiked / Faceted Industrial Cap -->
    <polygon points="260,120 340,120 360,180 240,180" fill="url(#rebelGunmetal)" stroke="#FF6B3D" stroke-width="1.5"/>
    <circle cx="300" cy="150" r="10" fill="#FF6B3D"/>

    <!-- Sharp Geometric Diamond Flacon Body -->
    <polygon points="300,210 430,340 390,680 210,680 170,340" fill="url(#rebelFlame)" stroke="url(#rebelGunmetal)" stroke-width="2.5"/>

    <!-- Angular Facet Lines -->
    <line x1="300" y1="210" x2="300" y2="680" stroke="#FF8A65" stroke-opacity="0.6" stroke-width="2"/>
    <line x1="300" y1="210" x2="210" y2="680" stroke="#000" stroke-opacity="0.4" stroke-width="2"/>
    <line x1="300" y1="210" x2="390" y2="680" stroke="#FFF" stroke-opacity="0.2" stroke-width="2"/>

    <!-- Shield Plate -->
    <polygon points="250,420 350,420 330,550 300,570 270,550" fill="#140905" stroke="#FF6B3D" stroke-width="2"/>
    
    <text x="300" y="470" font-family="'Cinzel', serif" font-size="20" font-weight="bold" fill="#FFFFFF" text-anchor="middle" letter-spacing="3">REBEL</text>
    <text x="300" y="495" font-family="'Montserrat', sans-serif" font-size="8.5" fill="#FF8A65" text-anchor="middle" letter-spacing="2">POUR HOMME</text>
    <text x="300" y="525" font-family="'Montserrat', sans-serif" font-size="7" fill="#AAA" text-anchor="middle" letter-spacing="1">SPICED CEDAR</text>
  </g>
</svg>